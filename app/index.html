<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  /* No -webkit-app-region here on purpose — see the dragging block in the
     script. Everything is absolutely positioned, so the body it would have
     been attached to is a zero-height box. */
  #stage { cursor: grab; }
  body.dragging, body.dragging #stage { cursor: grabbing; }
  /* Visibility on any wallpaper: a rim light that hugs the sprite's actual
     silhouette, plus a soft ground shadow. (A big radial cloud behind the
     body just smeared gray over dark wallpapers.) */
  body.glow #stage {
    filter: drop-shadow(0 0 5px rgba(255, 255, 250, 0.55)) drop-shadow(0 0 1px rgba(255, 255, 250, 0.4));
  }
  #ground {
    position: absolute;
    bottom: 36px; /* straddles the feet line */
    left: 50%;
    width: 130px;
    height: 20px;
    margin-left: -65px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.32), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  #bubble {
    position: absolute;
    /* Above the character: bottom-anchored just over the wizard-hat zone, so
       a long message grows UPWARD and never covers the pet. (top:6px floated
       it in empty sky; bottom:20px sat it on the pet's feet — this tracks the
       head instead.) */
    bottom: 212px;
    left: 50%;
    transform: translateX(-50%);
    /* width:max-content is load-bearing — an abspos box at left:50% otherwise
       shrinks to the 110px between it and the window edge, and max-width never
       gets a say. That wraps short notices into five clipped lines. */
    width: max-content;
    max-width: 200px;
    /* the window is short: cap at 3 lines rather than overflow into nothing,
       and stay clear of the wizard hat below */
    max-height: 3.2em;
    overflow: hidden;
    padding: 5px 9px;
    background: #fffef2;
    border: 3px solid #2b2b2b;
    border-radius: 2px;
    box-shadow: 3px 3px 0 #2b2b2b;
    font-size: 11px;
    line-height: 1.3;
    color: #2b2b2b;
    white-space: normal;
    text-align: center;
    opacity: 0;
    transition: opacity 0.15s steps(3);
    pointer-events: none;
    z-index: 3; /* the canvas is later in the DOM and would paint over it */
  }
  #bubble.show { opacity: 1; }
  #stage {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    image-rendering: pixelated;
    z-index: 1;
  }
  #stats {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 1px;
    color: #fffef2;
    text-shadow: 1px 1px 0 #2b2b2b, -1px 1px 0 #2b2b2b, 1px -1px 0 #2b2b2b, -1px -1px 0 #2b2b2b;
    white-space: nowrap;
  }
  /* Everything the pet is made of lives in here and scales as one unit. The
     box is the unscaled base size, anchored to the window's bottom centre, so
     scaling about that origin makes it fill the resized window exactly. */
  #pet {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 220px;
    height: 280px;
    margin-left: -110px;
    transform-origin: bottom center;
  }
</style>
</head>
<body>
<div id="pet">
  <div id="ground"></div>
  <div id="bubble"></div>
  <canvas id="stage" width="160" height="220"></canvas>
  <div id="stats"></div>
</div>

const fs = require("fs");
const os = require("os");
const path = require("path");
const { ipcRenderer } = require("electron");

window.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  ipcRenderer.send("pet-menu");
});

ipcRenderer.on("pet-notice", (_e, text) => say(text, true));

/* ---------- dragging ---------- */
// `-webkit-app-region: drag` was on the body, but every element in this window
// is absolutely positioned, so that body is a zero-height box and the drag
// region had no area — the pet couldn't be picked up at all. Moving the window
// from JS sidesteps that, and app-region's trouble with transformed elements
// (#pet is one now that it scales).
//
// We only say when a drag starts and stops; main follows the OS cursor from
// there, so tracking keeps working even when you fling the pet fast enough to
// leave the cursor outside the window.
let drag = false;
let down = null; // where/when the button went down, to tell a pet from a drag

document.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return; // leave right-click to the context menu
  down = { t: Date.now(), x: e.screenX, y: e.screenY };
  walking = 0; // a hand on the pet ends a stroll (main stops moving the window)
  drag = true;
  document.body.classList.add("dragging");
  ipcRenderer.send("pet-drag-start");
});

function endDrag() {
  if (!drag) return;
  drag = false;
  document.body.classList.remove("dragging");
  ipcRenderer.send("pet-drag-end");
}
document.addEventListener("mouseup", (e) => {
  // A release that barely moved was never a drag — it was a pet. The drag
  // machinery ran anyway, harmlessly: a stationary cursor moves nothing.
  const wasPet =
    down && Date.now() - down.t < 350 &&
    Math.abs(e.screenX - down.x) + Math.abs(e.screenY - down.y) < 5;
  down = null;
  endDrag();
  if (wasPet) petted();
});
window.addEventListener("blur", endDrag); // button released outside the window

/* ---------- petting & treats ---------- */
const PET_COOLDOWN = 2500; // hearts every time, xp farming never
const TREAT_COOLDOWN = 5 * 60e3; // per run — a restart refills the cookie jar
let lastPet = 0;
let lastTreat = 0;

function petted() {
  const now = Date.now();
  play("love", 1800);
  if (now - lastPet < PET_COOLDOWN) return;
  lastPet = now;
  beep(SOUNDS.pet);
  S.mood = clamp(S.mood + 4);
  S.xp += 1;
  // a petted pet is a chatty pet — this is where session gossip comes out
  const fact = Math.random() < 0.45 ? sessionFact() : null;
  say(fact || pick(QUIPS.pet));
  save();
}

document.addEventListener("dblclick", () => {
  const now = Date.now();
  if (now - lastTreat < TREAT_COOLDOWN) {
    play("happy", 1500);
    say(pick(QUIPS.notreat));
    return;
  }
  lastTreat = now;
  S.hunger = clamp(S.hunger - 12);
  S.mood = clamp(S.mood + 6);
  S.xp += 2;
  play("eat", 2200);
  say(pick(QUIPS.treat));
  beep(SOUNDS.treat);
  save();
});

// tells us what to render at.
const petBox = document.getElementById("pet");
const applyScale = (s) => { petBox.style.transform = "scale(" + s + ")"; };
ipcRenderer.on("pet-init", (_e, cfg) => applyScale(cfg.scale));
ipcRenderer.on("pet-scale-set", (_e, s) => applyScale(s));

function beep(seq) {
  if (!S.sound || !S.custom.volume) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    let t = audio.currentTime + 0.01;
    for (const [freq, dur] of seq) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "square"; // chiptune, obviously
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001 * S.custom.volume, t); // 60% ≈ the old fixed level
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    }
  } catch (e) {}
}

/* ---------- test-run awareness ---------- */
const TEST_CMDS = [
  /\b(?:npm|pnpm|yarn|bun)\s+(?:run\s+)?tests?\b/i,
  /\bnpx?\s+(?:jest|vitest|mocha|ava|tap|uvu|playwright\s+test|cypress\s+run)\b/i,
  /\b(?:jest|vitest|mocha)\b/i,
  /\b(?:pytest|py\.test|tox|nose2)\b/i,
  /\bpython3?\s+-m\s+(?:pytest|unittest)\b/i,
  /\bgo\s+test\b/i,
  /\bcargo\s+(?:test|nextest)\b/i,
  /\b(?:rspec|minitest)\b/i,
  /\b(?:rake|bundle\s+exec\s+rake)\s+test\b/i,
  /\bphpunit\b/i,
  /\b(?:mvn|gradlew|gradle|ant)\b[^\n]*\btest\b/i,
  /\bdotnet\s+test\b/i,
  /\bswift\s+test\b/i,
  /\bmix\s+test\b/i,
  /\bctest\b/i,
];
const isTestCmd = (cmd) => TEST_CMDS.some((re) => re.test(cmd || ""));

// Best-effort tally across the common runners. Returns nulls when it can't tell.
function parseTests(text) {
  const out = String(text || "");
  let passed = null, failed = null, m;

  // jest "Tests:  1 failed, 12 passed, 13 total" / vitest "Tests  12 passed (12)".
  // Requiring a digit after the label keeps jest's "Test Suites:" line out of it.
  if ((m = out.match(/^[ \t]*Tests?[ \t]*:?[ \t]+(\d[^\n]*)$/im))) {
    const f = m[1].match(/(\d+)\s+failed/i);
    const p = m[1].match(/(\d+)\s+passed/i);
    if (f) failed = +f[1];
    if (p) passed = +p[1];
    // These runners omit the zero side, so an absent count really is zero.
    // Pinning it also stops the loose fallbacks below from grabbing a stray
    // number out of unrelated earlier output.
    if (failed === null && passed !== null) failed = 0;
    if (passed === null && failed !== null) passed = 0;
  }
  // rust: "test result: ok. 12 passed; 0 failed"
  if ((m = out.match(/test result:.*?(\d+)\s+passed;\s*(\d+)\s+failed/i))) {
    passed = +m[1];
    failed = +m[2];
  }
  // pytest and friends: "==== 2 failed, 10 passed in 0.42s ===="
  if (failed === null && (m = out.match(/(\d+)\s+failed/i))) failed = +m[1];
  if (passed === null && (m = out.match(/(\d+)\s+passed/i))) passed = +m[1];

  let ok = null;
  if (failed !== null) ok = failed === 0;
  else if (/(^|\s)(FAIL|FAILED|panic:|Traceback|✗|✘)/m.test(out)) ok = false;
  else if (passed !== null || /(^|\s)(PASS|ok\s|✓)/m.test(out)) ok = true;
  return { passed, failed, ok };
}

// exitedOk: PostToolUse means the command exited 0, PostToolUseFailure means it didn't.
function reactToTestRun(text, exitedOk) {
  const r = parseTests(text);
  const green = exitedOk && r.ok !== false;
  if (green) {
    S.greens++;
    S.xp += 20;
    S.mood = clamp(S.mood + 12);
    S.hunger = clamp(S.hunger - 10);
    play("party", 3500);
    say(r.passed ? `${r.passed} tests green ✓` : pick(QUIPS.green));
    beep(SOUNDS.green);
  } else {
    S.reds++;
    S.mood = clamp(S.mood - 10);
    S.energy = clamp(S.energy - 5);
    play("sad", 3500);
    say(r.failed ? `${r.failed} test${r.failed === 1 ? "" : "s"} red...` : pick(QUIPS.red));
    beep(SOUNDS.red);
  }
}

function applyEvent(ev) {
  const t = ev.hook_event_name || "";
  const tool = ev.tool_name || "";
  const cmd = ev.command || "";
  const oldLevel = level();
  S.lastEvent = Date.now();
  trackSession(ev);

  if (t === "SessionStart") { S.mood = clamp(S.mood + 10); play("happy", 2500); say(pick(QUIPS.wake)); beep(SOUNDS.wake); }
  else if (t === "UserPromptSubmit") { S.mood = clamp(S.mood + 2); play("happy", 1200); }
  else if (t === "PostToolUse") {
    S.xp += 2; S.energy = clamp(S.energy - 1);
    if (["Edit", "Write", "MultiEdit", "NotebookEdit"].includes(tool)) {
      S.hunger = clamp(S.hunger - 8); S.xp += 3;
      play("eat", 2000);
      if (Math.random() < 0.25) say(pick(QUIPS.eat));
      if (Date.now() - lastEatBeep > 8000) { lastEatBeep = Date.now(); beep(SOUNDS.eat); }
    }
    if (tool === "Bash") {
      if (cmd.includes("git commit")) {
        S.commits++; S.hunger = clamp(S.hunger - 20); S.mood = clamp(S.mood + 15); S.xp += 25;
        play("party", 3500); say(pick(QUIPS.commit)); beep(SOUNDS.commit);
      } else if (isTestCmd(cmd)) {
        reactToTestRun(ev.output, true);
      } else if (/\bgit\s+push\b/.test(cmd)) {
        S.mood = clamp(S.mood + 10); S.xp += 10;
        play("party", 3000); say(pick(QUIPS.push)); beep(SOUNDS.commit);
      } else if (/\b(?:npm|pnpm|yarn|bun)\s+(?:i|install|add)\b/.test(cmd)) {
        S.hunger = clamp(S.hunger - 4);
        play("eat", 2000); if (Math.random() < 0.6) say(pick(QUIPS.deps));
      } else if (/\bgit\s+(?:checkout\s+-b|switch\s+-c)\b/.test(cmd) && Math.random() < 0.6) {
        play("happy", 1500); say(pick(QUIPS.branch));
      }
    }
    // the quieter tools get the occasional aside instead of silence
    else if ((tool === "WebSearch" || tool === "WebFetch") && Math.random() < 0.2) { play("happy", 1500); say(pick(QUIPS.web)); }
    else if (tool === "Task" && Math.random() < 0.35) { play("happy", 1500); say("recruiting minions!"); }
    else if (["Read", "Grep", "Glob"].includes(tool) && Math.random() < 0.06) { say(pick(QUIPS.read)); }
  }
  else if (t === "PostToolUseFailure") {

/* ---------- session awareness (pure) ---------- */
// The hook hands us session_id / cwd / transcript_path. The APP (never the
// hook — invariant 1) then reads transcript tails to learn what the pet can
// honestly claim to know: model, context fullness, token burn. Everything in
// this block is Node-pure so the test suite can lift and exercise it.

const SESSIONS = new Map(); // session_id → {cwd, transcript, last, ended, tools, tOffset, lastMsgId, ctx, model, warned}
const BURN = []; // {t, tokens} per assistant message, pruned past the window
const BURN_WINDOW_MS = 5 * 3600e3; // the shape of Claude's rolling usage window
const CTX_WINDOW = 200000; // assumed context size — the labels say "~" on purpose
const SESSION_FRESH_MS = 15 * 60e3;

function trackSession(ev) {
  if (!ev.session_id) return;
  const s = SESSIONS.get(ev.session_id) || { tools: 0 };
  s.cwd = ev.cwd || s.cwd;
  s.transcript = ev.transcript_path || s.transcript;
  s.last = Date.now();
  if (ev.hook_event_name === "PostToolUse") s.tools++;
  if (ev.hook_event_name === "SessionEnd") s.ended = true;
  if (ev.hook_event_name === "SessionStart") s.ended = false; // resumed
  SESSIONS.set(ev.session_id, s);
}

const activeSessions = () =>
  [...SESSIONS.values()].filter((s) => !s.ended && Date.now() - s.last < SESSION_FRESH_MS);

const proj = (s) => path.basename(s.cwd || "") || "somewhere";

// The busiest live session's context, or null — feeds the stats line and the
// periodic report, so both always tell the same story.
function busyCtx() {
  const b = activeSessions().filter((s) => s.ctx).sort((x, y) => y.ctx - x.ctx)[0];
  return b ? { pct: Math.min(999, Math.round((b.ctx / CTX_WINDOW) * 100)), proj: proj(b) } : null;
}

// One API response spans several transcript lines, each repeating the same
// usage block — the caller must count each message id once or burn triples.
function usageFromLine(line) {
  if (!line.includes('"usage"') || !line.includes('"assistant"')) return null;
  try {
    const o = JSON.parse(line);
    const m = o.message;
    if (o.type !== "assistant" || !m || !m.usage) return null;
    // Subagent (sidechain) lines live in the same transcript with their own,
    // much smaller usage — counting them made the context readout bounce
    // between the session's real number and whatever a helper was doing.
    if (o.isSidechain) return null;
    const u = m.usage;
    return {
      id: m.id || o.requestId || "",
      t: Date.parse(o.timestamp) || Date.now(),
      model: m.model || "",
      ctx: (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0),
      out: u.output_tokens || 0,
    };
  } catch (e) {
    return null;
  }
}

const fmtTokens = (n) =>
  n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
  : n >= 1000 ? Math.round(n / 1000) + "k"
  : String(n);

// "claude-fable-5" → "fable-5", "claude-opus-4-1-20250805" → "opus-4-1"
const shortModel = (m) => String(m).replace(/^claude-/, "").replace(/-\d{8}$/, "");

/* ---------- session awareness (io) ---------- */
const TRANSCRIPT_POLL = 15e3;

async function readTranscripts() {
  for (const s of activeSessions()) {
    if (!s.transcript) continue;
    try {
      const st = await fs.promises.stat(s.transcript);
      // First sight of a session: start near the end — the pet reports on the
      // present, not archaeology. (A first partial line just fails to parse.)
      if (s.tOffset == null || st.size < s.tOffset) s.tOffset = Math.max(0, st.size - 64 * 1024);
      if (st.size === s.tOffset) continue;
      const fh = await fs.promises.open(s.transcript, "r");
      let buf;
      try {
        buf = Buffer.alloc(Math.min(st.size - s.tOffset, 4 * 1024 * 1024));
        await fh.read(buf, 0, buf.length, s.tOffset);
      } finally {
        await fh.close();
      }
      const cut = buf.lastIndexOf(0x0a);
      if (cut === -1) continue;
      s.tOffset += cut + 1;
      for (const line of buf.slice(0, cut).toString("utf8").split("\n")) {
        const u = usageFromLine(line);
        if (!u) continue;
        s.ctx = u.ctx;
        s.model = u.model;
        if (u.id && u.id === s.lastMsgId) continue; // same message, another line
        s.lastMsgId = u.id;
        BURN.push({ t: u.t, tokens: u.out });
      }
      while (BURN.length && BURN[0].t < Date.now() - BURN_WINDOW_MS) BURN.shift();
    } catch (e) {} // transcript gone or unreadable — the pet just knows less
  }
  contextWarnings();
}
setInterval(readTranscripts, TRANSCRIPT_POLL);

// The "tell me before I hit the wall" part: one warning per threshold, armed
// again once a /compact (or new task) drops the context back down.
function contextWarnings() {
  for (const s of activeSessions()) {
    if (!s.ctx) continue;
    const pct = Math.round((s.ctx / CTX_WINDOW) * 100);
    if (pct < 60) s.warned = 0;
    const tier = pct >= 90 ? 90 : pct >= 75 ? 75 : 0;
    if (tier && (s.warned || 0) < tier) {
      s.warned = tier;
      say(`⚠ context ~${pct}% in ${proj(s)}${tier >= 90 ? " — /compact soon!" : ""}`, tier >= 90);
      play(tier >= 90 ? "sad" : "happy", 2500);
      beep(SOUNDS.warn);
    }
  }
}

// One nugget of gossip, or null when the pet has nothing worth saying.
function sessionFact() {
  const act = activeSessions();
  const facts = [];
  if (act.length) {
    const names = [...new Set(act.map(proj))].slice(0, 3).join(", ");
    facts.push(act.length === 1 ? `watching ${names}` : `${act.length} sessions: ${names}`);
    const tools = act.reduce((n, s) => n + s.tools, 0);
    if (tools > 5) facts.push(`${tools} tool calls watched`);
  }
  const busiest = act.filter((s) => s.ctx).sort((a, b) => b.ctx - a.ctx)[0];
  if (busiest) {
    facts.push(`context ~${Math.round((busiest.ctx / CTX_WINDOW) * 100)}% in ${proj(busiest)}`);
    if (busiest.model) facts.push(`${shortModel(busiest.model)} on the case`);
  }
  const burned = BURN.reduce((n, b) => n + b.tokens, 0);
  if (burned > 1000) facts.push(`~${fmtTokens(burned)} tokens out in 5h`);
  return facts.length ? pick(facts) : null;
}

// Unprompted gossip: rarely, and only while someone's actually working.
setInterval(() => {
  if (Date.now() - S.lastEvent > 20 * 60e3) return; // nobody's here — stay quiet
  if (S.energy < 20 || Math.random() > 0.35) return;
  const fact = sessionFact();
  if (fact) {
    say(fact);
    play("happy", 1500);
    beep(SOUNDS.gossip);
  }
}, 150e3);

// The reliable usage report, on a clock instead of a dice roll. The /usage
// plan limits live behind an authenticated API call inside Claude Code — not
// on disk — so the pet reports the two things it can honestly measure from
// transcripts: context fullness and the rolling 5h output burn.
setInterval(() => {
  if (Date.now() - S.lastEvent > 20 * 60e3) return;
  const b = busyCtx();
  if (!b || b.pct < 40) return; // nothing worth interrupting for yet
  const burned = BURN.reduce((n, x) => n + x.tokens, 0);
  say(`🧠 ~${b.pct}% ctx in ${b.proj}${burned > 1000 ? ` · ~${fmtTokens(burned)} out/5h` : ""}`);
}, 10 * 60e3);

/* ---------- tailing + rotation ---------- */
const LOG_CAP = 512 * 1024; // and again whenever it gets chunky mid-session
let rotateOnLaunch = true; // clear out whatever queued up while the app was closed

function rotate() {
  if (!rotateOnLaunch && S.offset < LOG_CAP) return;
  try {
    // Only truncate when we have consumed every byte — otherwise a parallel
    // session appended between our read and now and we would eat its events.
    if (fs.statSync(EVENTS).size !== S.offset) return;
    fs.truncateSync(EVENTS, 0);
    S.offset = 0;
    rotateOnLaunch = false;
    save();
  } catch (e) {}
}

function poll() {
  let st;
  try { st = fs.statSync(EVENTS); } catch (e) { return; } // no events file yet
  if (st.size < S.offset) S.offset = 0; // file was truncated/rotated under us

  if (st.size > S.offset) {
    const buf = Buffer.alloc(st.size - S.offset);
    const fd = fs.openSync(EVENTS, "r");
    try { fs.readSync(fd, buf, 0, buf.length, S.offset); } finally { fs.closeSync(fd); }

    // A hook may be mid-append: consume only through the last complete line, and
    // count bytes (not chars) so a split multi-byte char can't drift the offset.
    const cut = buf.lastIndexOf(0x0a);
    if (cut === -1) return; // nothing complete yet, try again next tick
    S.offset += cut + 1;
    for (const line of buf.slice(0, cut).toString("utf8").split("\n")) {
      if (!line.trim()) continue;
      try { applyEvent(JSON.parse(line)); } catch (e) {}
    }
    save();
  }
  rotate();
}
poll(); // catch up on everything queued while the app was closed
setInterval(poll, 500);

/* passive decay */
setInterval(() => {
  S.hunger = clamp(S.hunger + 0.5);
  const idleMs = Date.now() - S.lastEvent;
  // Recovers properly while you're away, barely while you're hammering tools.
  S.energy = clamp(S.energy + (idleMs > IDLE_MS ? 2.5 : 0.3));
  if (idleMs > 30 * 60e3) S.mood = clamp(S.mood - 0.5);
  // Sometimes stroll off when you've been away a few minutes. Awake pets only —
  // main also refuses while dragging, click-through, or settings are up.
  if (idleMs > 3 * 60e3 && S.energy >= 20 && level() > 0 && Math.random() < 0.07)
    ipcRenderer.send("pet-wander"); // eggs do not go for walks

  save();
}, 20e3);

/* ---------- eyes & walking ---------- */
let cursorAt = null; // offset from window centre in screen px, null = nobody near
let walking = 0; // -1/1 while main strolls the window along, 0 otherwise
let glance = { dx: 0, until: 0 }; // idle look-arounds when nobody's pointing at us

ipcRenderer.on("pet-cursor", (_e, c) => { cursorAt = c; });
ipcRenderer.on("pet-walk", (_e, dir) => {
  walking = dir | 0;
  if (walking) play("walk", 60e3); // main says when the stroll is over
  else if (anim.name === "walk") anim.until = 0;
});

/* ---------- pixel rendering ---------- */
const cv = document.getElementById("stage");
const cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;
const PX = 10; // 16x16 grid
// Six spare rows above the grid: the tallest characters crown at row 0, the
// wizard hat wants four rows above THAT, and the party bob lifts everything
// two more. Without the headroom the hat clips straight off the canvas.
const TOP = 6;
const INK = "#2b2b2b";

const px = (x, y, c) => { cx.fillStyle = c; cx.fillRect(x * PX, (y + TOP) * PX, PX, PX); };

function drawGrid(grid, bodyColor, dy, extra) {
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const ch = grid[y][x];
      if (ch === "B") px(x, y + dy, bodyColor);
      else if (ch === "D") px(x, y + dy, INK);
      else if (ch !== "." && extra && extra[ch]) px(x, y + dy, extra[ch]);
    }
}

let frame = 0;
let lastMode = ""; // so the sleep motif plays at the moment of dozing off, once
function render() {
  frame++;
  cx.clearRect(0, 0, cv.width, cv.height);
  const st = stage();
  const now = Date.now();
  let a = now < anim.until ? anim.name : null;

  // fall back to mood idle
  if (!a) {
    // Only doze off once you've actually stopped. Gating on energy alone put
    // the pet to sleep for the whole session, since a busy session drains it
    // far faster than it recovers — exactly when you want it lively.
    if (S.energy < 20 && now - S.lastEvent > IDLE_MS) a = "sleep";
    else if (S.hunger > 75) a = "hungry";
    else if (S.mood < 35) a = "sad";
    else a = "idle";
  }
  if (a === "sleep" && lastMode !== "sleep") beep(SOUNDS.sleep);
  lastMode = a;

  const bob =
    a === "party" ? (frame % 2 ? -2 : 0)
    : a === "walk" ? (frame % 2 ? -1 : 0) // brisker step than the idle bob
    : frame % 4 < 2 ? 0 : -1;
  const dy = a === "sleep" ? 1 : bob;
  const chr = CHARACTERS[S.custom.character] || CHARACTERS.blob;
  const isEgg = st.name === "egg";
  const L = isEgg ? null : chr.stages[st.name] || chr.stages.senior; // the wizard wears the senior body
  drawGrid(isEgg ? EGG_GRID : L.grid, bodyColor(), dy, chr.colors);

  if (!isEgg) {
    // Where to look: a nearby cursor wins, then stroll direction, then the
    // occasional idle glance. HORIZONTAL only — vertical pupil shift dragged
    // the eyes toward the mouth and made the whole face fall apart.
    let lx = 0;
    if (a === "walk" && walking) {
      lx = walking;
    } else if (cursorAt) {
      lx = Math.abs(cursorAt.dx) > 30 ? Math.sign(cursorAt.dx) : 0;
    } else {
      if (now > glance.until && Math.random() < 0.02)
        glance = { dx: Math.floor(Math.random() * 3) - 1, until: now + 1200 };
      if (now < glance.until) lx = glance.dx;
    }

    const ey = L.eyeY + dy;

    // eyes — the classic format: 2px tall, 1px on blink, nothing fancier
    if (a === "sleep") { px(L.eyeXL, ey, INK); px(L.eyeXL + 1, ey, INK); px(L.eyeXR - 1, ey, INK); px(L.eyeXR, ey, INK); }
    else if (a === "sad") { px(L.eyeXL, ey + 1, INK); px(L.eyeXR, ey + 1, INK); }
    else if (frame % 24 === 0) { px(L.eyeXL, ey, INK); px(L.eyeXR, ey, INK); } // blink
    else {
      for (let i = 0; i < L.eyeH; i++) {
        px(L.eyeXL + lx, ey + i, INK);
        px(L.eyeXR + lx, ey + i, INK);
      }
    }

    // mouth, around the stage's centre columns — a goose's mouth IS its beak
    const mc = chr.mouthColor || INK;
    const mx = L.cx;
    const my = L.mouthY + dy;
    if (a === "eat") { if (frame % 2) { px(mx, my, mc); px(mx + 1, my, mc); px(mx, my - 1, mc); px(mx + 1, my - 1, mc); } else { px(mx, my, mc); px(mx + 1, my, mc); } }
    else if (a === "party" || a === "love") { px(mx - 1, my - 1, mc); px(mx, my, mc); px(mx + 1, my, mc); px(mx + 2, my - 1, mc); }
    else if (a === "sad" || a === "hungry") { px(mx, my, mc); px(mx + 1, my, mc); px(mx - 1, my + 1, mc); px(mx + 2, my + 1, mc); }
    else { px(mx, my, mc); px(mx + 1, my, mc); if (chr.bill) { px(mx - 1, my, mc); px(mx + 2, my, mc); } }

    // blush when happy
    if (a === "party" || a === "love" || S.mood > 80) { px(L.blushXL, L.blushY + dy, "#f48fb1"); px(L.blushXR, L.blushY + dy, "#f48fb1"); }
  } else if (frame % 8 < 2) {
    // egg wiggles occasionally: crack pixel
    px(8, 5, INK);
  }

  // wizard hat — anchored to the crown and centre of whoever's wearing it
  if (st.name === "wizard") {
    const H = "#4a148c";
    const t = L.top;
    px(L.cx, t - 4 + dy, H); px(L.cx + 1, t - 4 + dy, H);
    for (let x = L.cx - 1; x <= L.cx + 2; x++) px(x, t - 3 + dy, H);
    for (let x = L.cx - 2; x <= L.cx + 3; x++) px(x, t - 2 + dy, H);
    for (let x = L.cx - 3; x <= L.cx + 4; x++) px(x, t - 1 + dy, H); // brim, resting on the crown
    px(L.cx, t - 2 + dy, "#ffd54f"); // gem, set into the hat rather than floating beside it
  }

  // accessories (settings) — anchored to the stage's layout, drawn after the
  // hat so the layering is stable
  const acc = isEgg ? "none" : S.custom.accessory;
  if (acc === "bow") {
    // side bow on the crown; on a wizard it reads as pinned to the brim
    const bx = L.blushXL;
    px(bx, L.top - 1 + dy, "#f06292"); px(bx + 1, L.top - 1 + dy, "#f06292");
    px(bx, L.top + dy, "#f06292"); px(bx + 1, L.top + dy, "#c2185b"); // knot
  } else if (acc === "scarf") {
    for (let x = L.scarfXL; x <= L.scarfXR; x++) px(x, L.scarfY + dy, "#e53935");
    px(L.scarfXL + 1, L.scarfY + 1 + dy, "#e53935"); px(L.scarfXL + 1, L.scarfY + 2 + dy, "#c62828"); // trailing end
  } else if (acc === "sprout" && st.name !== "wizard") { // the hat would bury it
    px(L.cx, L.top - 1 + dy, "#33691e"); // stem
    px(L.cx - 1, L.top - 2 + dy, "#66bb6a"); px(L.cx, L.top - 2 + dy, "#66bb6a"); px(L.cx + 1, L.top - 2 + dy, "#9ccc65"); // leaves
  }

  // confetti while partying — pinned to the outer columns, which the blob never
  // occupies, so it can't land on the pet's face and read as broken eyes
  if (a === "party") {
    const conf = ["#ffd54f", "#f48fb1", "#4dd0e1"];
    for (let i = 0; i < 4; i++) {
      px(i % 2 ? 15 : 0, (frame * 2 + i * 4) % 16, conf[i % conf.length]);
    }
  }

  // floating hearts while being petted — outer columns, same trick as confetti
  if (a === "love") {
    for (let i = 0; i < 3; i++) {
      px(i % 2 ? 15 : 0, 13 - ((frame * 2 + i * 5) % 13), "#f06292");
    }
  }

  // stubby alternating feet while strolling (orange webbed ones on a goose)
  if (a === "walk" && L) {
    const f = frame % 2;
    px(L.feetXL + f, 14 + dy, chr.feetColor || INK);
    px(L.feetXR - f, 14 + dy, chr.feetColor || INK);
  }

  // zzz
  if (a === "sleep" && frame % 4 < 2) { px(13, 3, "#fffef2"); px(14, 2, "#fffef2"); }

  // Context lives IN the stats line now — permanently visible, not a dice
  // roll. The ~ is honest: /200k assumed, measured from the transcript.
  const b = busyCtx();
  statsEl.textContent =
    `${S.custom.name ? S.custom.name + " " : ""}lv.${level()}  🍖${Math.round(100 - S.hunger)}  ⚡${Math.round(S.energy)}` +
    (b ? `  🧠${b.pct}%` : "");
}
setInterval(render, 250); // chunky 4fps, like the real thing
render();
</script>
</body>
</html>
