<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "SF Pro Text", sans-serif;
    cursor: default;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; }

  /* Speech bubble: sits above the head, grows UPWARD, never covers the pet */
  #bubble-zone {
    position: absolute; left: 12px; right: 12px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    pointer-events: none;
    /* bottom set from JS based on pet height/scale */
  }
  /* Cream card, hard black border, hard offset shadow, stepped fade — the
     pixel language the whole app speaks. No soft shadows, no easing curves. */
  #bubble {
    position: relative; /* the tail anchors to the bubble, not the zone */
    /* width:max-content is load-bearing — a flex item otherwise stretches to
       the zone and a three-word quip becomes a full-width banner. */
    width: max-content;
    max-width: min(200px, 100%);
    max-height: 3.4em;
    overflow: hidden;
    background: #fffef2;
    color: #2b2b2b;
    border: 3px solid #2b2b2b;
    border-radius: 2px;
    box-shadow: 3px 3px 0 #2b2b2b;
    padding: 6px 10px 7px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px; line-height: 1.35;
    text-align: center;
    opacity: 0; transform: translateY(3px);
    transition: opacity 150ms steps(3), transform 150ms steps(3);
  }
  #bubble.show { opacity: 1; transform: translateY(0); }
  /* important = the pet needs you: amber fill, same hard frame */
  #bubble.important {
    background: #ffd76e;
    font-weight: 700;
    box-shadow: 3px 3px 0 #2b2b2b, 0 0 0 1px #2b2b2b;
  }
  /* The pixel tail hangs off the ZONE, not the bubble: the bubble clips its
     own overflow for the 3-line clamp and would cut the tail off. The zone is
     bottom-anchored to the bubble, so they stay together. */
  #bubble-zone::after {
    content: ""; position: absolute; left: 50%; margin-left: -5px; bottom: -9px;
    width: 10px; height: 6px;
    background: #fffef2;
    border: 3px solid #2b2b2b; border-top: 0;
    box-shadow: 3px 3px 0 #2b2b2b;
    opacity: 0; transition: opacity 150ms steps(3);
  }
  #bubble-zone.show::after { opacity: 1; }
  #bubble-zone.important::after { background: #ffd76e; }

  /* Stats line: real telemetry in text; fiction lives in body language.
     On demand — a desktop pet that permanently wears a status bar is a widget.
     pet.js raises it when the cursor comes near (see updateHover). */
  #stats-zone {
    position: absolute; left: 0; right: 0; bottom: 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none;
    opacity: 0; transform: translateY(3px);
    transition: opacity 140ms steps(3), transform 140ms steps(3);
  }
  #stats-zone.show { opacity: 1; transform: translateY(0); }
  /* A small pixel plate rather than floating text: same cream paper, hard
     border and hard shadow as the speech bubble, so the two read as a set. */
  .pill {
    background: #fffef2;
    color: #2b2b2b;
    border: 2px solid #2b2b2b;
    box-shadow: 2px 2px 0 #2b2b2b;
    padding: 2px 6px 3px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 9.5px; letter-spacing: 0.3px;
    white-space: nowrap;
    max-width: calc(100% - 16px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .pill.strip {
    font-size: 8.5px; padding: 1px 5px 2px;
    background: #ece9d8; color: rgba(43, 43, 43, 0.75);
    box-shadow: 2px 2px 0 rgba(43, 43, 43, 0.55);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="pet"></canvas>
    <div id="bubble-zone"><div id="bubble"></div></div>
    <div id="stats-zone">
      <div class="pill strip" id="strip" style="display:none"></div>
      <div class="pill" id="stats" style="display:none"></div>
    </div>
  </div>
  <script src="art.js"></script>
  <script src="sounds.js"></script>
  <script src="pet.js"></script>
</body>
</html>
