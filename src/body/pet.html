<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, "SF Pro Text", sans-serif;
    cursor: default;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; }

  /* Speech bubble: sits above the head, grows UPWARD, never covers the pet */
  #bubble-zone {
    position: absolute; left: 12px; right: 12px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    pointer-events: none;
    /* bottom set from JS based on pet height/scale */
  }
  /* Cream card, hard black border, hard offset shadow, stepped fade — the
     pixel language the whole app speaks. No soft shadows, no easing curves. */
  #bubble {
    position: relative; /* the tail anchors to the bubble, not the zone */
    max-width: 100%;
    background: #fffef2;
    color: #2b2b2b;
    border: 3px solid #2b2b2b;
    border-radius: 2px;
    box-shadow: 3px 3px 0 #2b2b2b;
    padding: 6px 10px 7px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px; line-height: 1.35;
    text-align: center;
    opacity: 0; transform: translateY(3px);
    transition: opacity 150ms steps(3), transform 150ms steps(3);
  }
  #bubble.show { opacity: 1; transform: translateY(0); }
  /* important = the pet needs you: amber fill, same hard frame */
  #bubble.important {
    background: #ffd76e;
    font-weight: 700;
    box-shadow: 3px 3px 0 #2b2b2b, 0 0 0 1px #2b2b2b;
  }
  /* a two-block pixel tail, drawn under the bubble's bottom border */
  #bubble::after {
    content: ""; position: absolute; left: 50%; margin-left: -5px; bottom: -9px;
    width: 10px; height: 6px;
    background: #fffef2;
    border: 3px solid #2b2b2b; border-top: 0;
    box-shadow: 3px 3px 0 #2b2b2b;
  }
  #bubble.important::after { background: #ffd76e; }

  /* Stats line: real telemetry in text; fiction lives in body language */
  #stats-zone {
    position: absolute; left: 0; right: 0; bottom: 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    pointer-events: none;
  }
  /* Cream text in a hard black outline — legible on any wallpaper without a
     panel behind it, and it keeps the pixel language. */
  .pill {
    color: #fffef2;
    padding: 0 4px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.6px;
    white-space: nowrap;
    max-width: calc(100% - 10px);
    overflow: hidden; text-overflow: ellipsis;
    text-shadow:
      1px 1px 0 #2b2b2b, -1px 1px 0 #2b2b2b, 1px -1px 0 #2b2b2b, -1px -1px 0 #2b2b2b,
      0 2px 0 #2b2b2b, 0 -2px 0 #2b2b2b, 2px 0 0 #2b2b2b, -2px 0 0 #2b2b2b;
  }
  .pill.strip { font-size: 9px; opacity: 0.9; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="pet"></canvas>
    <div id="bubble-zone"><div id="bubble"></div></div>
    <div id="stats-zone">
      <div class="pill strip" id="strip" style="display:none"></div>
      <div class="pill" id="stats" style="display:none"></div>
    </div>
  </div>
  <script src="art.js"></script>
  <script src="sounds.js"></script>
  <script src="pet.js"></script>
</body>
</html>
